<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071120">
  <meta name="referrer" content="no-referrer">
  <title>Workspace</title>
  <link rel="icon" href="./assets/nox-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/decoy-v11.css?v=20260915-v133">
</head>
<body>
  <div id="decoy-shell" class="decoy-shell">
    <aside class="decoy-sidebar">
      <div class="brand"><img src="./assets/nox-mark.svg" alt=""><div><strong>Nox Vault</strong><span>PRIVATE BY DESIGN</span></div></div>
      <nav id="decoy-nav">
        <button id="decoy-home" class="active"><span>⌂</span>Home</button>
        <button id="decoy-unlock" class="unlock-btn"><span>⚙</span><div><strong>Settings</strong><small>Unlock Nox Vault</small></div></button>
        <div id="decoy-sections"></div>
      </nav>
      <div class="spacer"></div>
      <div class="version">Nox Vault<br><span>Quiet workspace</span></div>
    </aside>
    <main class="decoy-main">
      <header class="decoy-topbar">
        <div><strong id="decoy-title">Home</strong><small id="decoy-url-label">Neutral workspace</small></div>
        <a id="decoy-external" class="external-link" href="#" target="_blank" rel="noopener noreferrer">Open page ↗</a>
      </header>
      <section class="frame-wrap">
        <iframe id="decoy-frame" title="Decoy workspace" allow="fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </section>
    </main>
  </div>
  <div id="decoy-modal" class="unlock-overlay hidden">
    <form id="decoy-unlock-form" class="unlock-card">
      <img src="./assets/nox-mark.svg" alt="">
      <h2>Unlock Nox Vault</h2>
      <p>Enter the password for the current vault.</p>
      <input id="decoy-password" type="password" autocomplete="current-password" placeholder="Vault password" minlength="2" autofocus required>
      <p id="decoy-message" class="message"></p>
      <div class="actions"><button id="decoy-cancel" type="button">Cancel</button><button class="primary" type="submit">Unlock</button></div>
    </form>
  </div>
  <script type="module" src="./js/decoy-v11.js?v=20260915-v133"></script>
</body>
</html>
