<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nox Vault Reset</title>
<style>
body{margin:0;background:#071120;color:#eef4ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{max-width:680px;padding:28px;border:1px solid #1c3b68;border-radius:18px;background:#0b1728;box-shadow:0 20px 70px #0008}button,a{font:inherit}.btn{border:1px solid #326cff;background:#164dc5;color:white;padding:12px 16px;border-radius:10px;cursor:pointer}.log{margin-top:18px;padding:14px;border-radius:10px;background:#050b14;white-space:pre-wrap;color:#a9c7ff}
</style>
</head>
<body><main class="card"><h1>Nox Vault browser reset</h1><p>This removes only Nox Vault service workers and browser caches for this GitHub Pages path. It does not delete Firebase data.</p><button id="reset" class="btn">Clear old Nox Vault cache</button><div id="log" class="log">Ready.</div></main>
<script>
const log=document.getElementById('log');
document.getElementById('reset').onclick=async()=>{
  const base=new URL('./',location.href).href;
  const lines=[];
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const r of regs){
        if(r.scope.startsWith(base)){ lines.push('Unregistering '+r.scope); await r.unregister(); }
      }
    }
    if('caches' in window){
      const keys=await caches.keys();
      for(const k of keys){ if(k.startsWith('nox-vault')){ lines.push('Deleting cache '+k); await caches.delete(k); } }
    }
    lines.push('Done. Redirecting to a cache-busted Nox Vault URL…');
    log.textContent=lines.join('\n');
    setTimeout(()=>location.href='./?fresh='+Date.now(),800);
  }catch(e){log.textContent='Reset failed: '+(e?.stack||e)}
};
</script></body></html>
